            // Helper: Read Excel File with Improved Error Handling
            const readExcel = (file) => {
                return new Promise((resolve, reject) => {
                    if (!file) {
                        reject(new Error("File tidak ditemukan"));
                        return;
                    }

                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        try {
                            const data = e.target.result;
                            if (!window.XLSX) {
                                throw new Error("Library Excel belum siap. Harap tunggu atau refresh.");
                            }

                            const workbook = window.XLSX.read(data, { type: 'array' });
                            if (!workbook.SheetNames.length) {
                                throw new Error("File Excel kosong.");
                            }

                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            const json = window.XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                            resolve(json);
                        } catch (err) {
                            reject(new Error("Gagal parsing Excel: " + err.message));
                        }
                    };
                    
                    reader.onerror = () => reject(new Error("Gagal membaca file."));
                    reader.readAsArrayBuffer(file);
                });
            };

            // Helper: Normalize Keys
            const normalizeKeys = (obj) => {
                const newObj = {};
                Object.keys(obj).forEach(key => {
                    newObj[key.toLowerCase().trim().replace(/[\s_./-]/g, '')] = obj[key];
                });
                return newObj;
            };

            // Helper: Extract Brand from Description
            const extractBrandFromDesc = (desc) => {
                if (!desc) return null;
                const descUpper = String(desc).toUpperCase();
                for (let brand of ALLOWED_BRANDS) {
                    if (descUpper.includes(brand)) {
                        return brand;
                    }
                }
                return null;
            };

            const handleProcess = async () => {
                if (!window.XLSX) {
                    setError("Sistem Excel belum siap.");
                    return;
                }
                if (usageFiles.length === 0 || !assetFile) {
                    setError("Harap unggah semua file: Data Pemakaian (MB51 2019-2025) DAN Brand By Equipment.");
                    return;
                }

                setIsProcessing(true);
                setError('');
                setResults([]);
                setProgressMsg('Mempersiapkan data...');

                setTimeout(async () => {
                    try {
                        // --- LANGKAH A: PEMETAAN ASET ---
                        setProgressMsg('Membaca File Brand By Equipment...');
                        const rawAssetData = await readExcel(assetFile);
                        
                        const assetMap = new Map(); 

                        rawAssetData.forEach(row => {
                            const norm = normalizeKeys(row);
                            const equipId = norm['equipment'] || norm['equepment'] || norm['noequipment'] || norm['unit'];
                            const brand = norm['merk'] || norm['brand'] || norm['manufacturer']; 
                            
                            // AMBIL DATA SITE
                            const site = norm['sitepit'] || norm['site'] || norm['pit'] || norm['lokasi'] || norm['project'];

                            if (equipId) {
                                const cleanID = String(equipId).trim();
                                const cleanBrand = brand ? String(brand).toUpperCase().trim() : "UNKNOWN";
                                const cleanSite = site ? String(site).toUpperCase().trim() : "-";
                                
                                assetMap.set(cleanID, { brand: cleanBrand, site: cleanSite });
                            }
                        });

                        // --- LANGKAH B: PROSES DATA MB51 (MULTI FILES) ---
                        let allRawUsageData = [];
                        
                        for (let i = 0; i < usageFiles.length; i++) {
                            setProgressMsg(`Membaca File MB51 (${i + 1} dari ${usageFiles.length})...`);
                            const fileData = await readExcel(usageFiles[i]);
                            allRawUsageData = allRawUsageData.concat(fileData);
                        }

                        setProgressMsg(`Total ${allRawUsageData.length} baris data transaksi. Menghitung frekuensi...`);

                        // Hitung Frekuensi (Pre-processing)
                        const frequencyMap = new Map();
                        allRawUsageData.forEach(row => {
                            const norm = normalizeKeys(row);
                            const material = String(norm['material'] || norm['materialno'] || norm['nomaterial'] || '').trim();
                            const equipId = String(norm['equipment'] || norm['noequipment'] || norm['unit'] || '').trim();
                            if (material && equipId) {
                                const key = `${material}|${equipId}`;
                                frequencyMap.set(key, (frequencyMap.get(key) || 0) + 1);
                            }
                        });

                        // Analisa Utama
                        setProgressMsg(`Menganalisa data...`);
                        const mpnGroups = {}; 

                        for (let i = 0; i < allRawUsageData.length; i++) {
                            const row = allRawUsageData[i];
                            const norm = normalizeKeys(row);
                            
                            const material = norm['material'] || norm['materialno'] || norm['nomaterial'];
                            const rawMpn = norm['mpn'] || norm['manufacturerpartno'] || norm['partnumber'];
                            const equipIdFromMB51 = norm['equipment'] || norm['noequipment'] || norm['unit'];
                            const desc = norm['description'] || norm['materialdescription'] || norm['deskripsi'];
                            
                            if (!material || !rawMpn) continue;

                            // FILTER: Material diawali angka 5 tidak dimasukkan
                            if (String(material).trim().startsWith('5')) {
                                continue;
                            }

                            const mpnKey = String(rawMpn).trim().toUpperCase();
                            if (mpnKey.length < 2 || mpnKey === 'N/A' || mpnKey === 'NO PART') continue;

                            const cleanEquipId = equipIdFromMB51 ? String(equipIdFromMB51).trim() : "";

                            // Filter Numeric Equipment
                            if (/^\d/.test(cleanEquipId)) continue; 

                            // Lookup Equipment Brand & Site
                            let eqBrand = "-"; 
                            let eqSite = "-"; 

                            if (cleanEquipId && assetMap.has(cleanEquipId)) {
                                const assetInfo = assetMap.get(cleanEquipId);
                                eqBrand = assetInfo.brand; 
                                eqSite = assetInfo.site; 
                            }

                            // Koreksi Brand khusus
                            if (eqBrand === "RIIPING DOZING") eqBrand = "KOMATSU";

                            // Filter Whitelist
                            if (!ALLOWED_BRANDS.has(eqBrand)) continue;

                            // --- LOGIKA LOKASI SITE (CLUSTER) ---
                            const SUMATERA_SITES = ["MME", "MAS", "COMEX CILEGON", "CILEGON", "PMSS"];
                            let siteLocation = "Kalimantan"; 
                            
                            if (eqSite && eqSite !== "-") {
                                if (SUMATERA_SITES.includes(eqSite.toUpperCase())) {
                                    siteLocation = "Cluster Sumatera";
                                }
                            }

                            // --- LOGIKA BARU: DETEKSI BRAND DARI DESKRIPSI MATERIAL ---
                            const materialBrand = extractBrandFromDesc(desc);

                            // --- TENTUKAN STATUS GENUINE ---
                            let genuineStatus = "Non Genuine";
                            if (materialBrand && eqBrand !== "-" && eqBrand !== "UNKNOWN") {
                                if (materialBrand === eqBrand) {
                                    genuineStatus = "Genuine";
                                }
                            }

                            // Ambil Frekuensi
                            const freqKey = `${String(material).trim()}|${cleanEquipId}`;
                            const transCount = frequencyMap.get(freqKey) || 1;

                            if (!mpnGroups[mpnKey]) {
                                mpnGroups[mpnKey] = [];
                            }

                            mpnGroups[mpnKey].push({
                                Material: String(material).trim(),
                                Description: desc || '',
                                MPN: String(rawMpn).trim(),
                                EquipId: cleanEquipId,
                                Brand: eqBrand, 
                                Site: eqSite, 
                                SiteLocation: siteLocation, 
                                MatBrand: materialBrand, 
                                TransCount: transCount,
                                GenuineStatus: genuineStatus
                            });
                        }

                        setProgressMsg(`Mengkalkulasi kandidat...`);

                        // ---------------------------------------------------------
                        // LANGKAH D: LOGIKA KANDIDAT & REKOMENDASI BY DATA (REVISI II)
                        // ---------------------------------------------------------
                        const finalCandidates = [];

                        Object.keys(mpnGroups).forEach(mpn => {
                            const transactions = mpnGroups[mpn];
                            const uniqueMaterialsMap = new Map();

                            // Deduplikasi material dalam grup
                            transactions.forEach(trx => {
                                const matCode = trx.Material;
                                if (!uniqueMaterialsMap.has(matCode)) {
                                    uniqueMaterialsMap.set(matCode, { ...trx, Count: 1 });
                                } else {
                                    uniqueMaterialsMap.get(matCode).Count++;
                                }
                            });

                            const distinctMaterials = Array.from(uniqueMaterialsMap.values());

                            // JIKA > 1 MATERIAL BERBEDA -> KANDIDAT
                            if (distinctMaterials.length > 1) {
                                
                                // --- LOGIKA REKOMENDASI BY DATA ---
                                const nonGenuineItems = distinctMaterials.filter(i => i.GenuineStatus !== "Genuine");
                                const maxNonGenTransCount = nonGenuineItems.length > 0 
                                    ? Math.max(...nonGenuineItems.map(i => i.TransCount)) 
                                    : 0;

                                // Tie-breaker for Non-Genuine
                                let winnerNonGenuineMaterial = null;
                                if (maxNonGenTransCount > 0) {
                                    const topContenders = nonGenuineItems
                                        .filter(i => i.TransCount === maxNonGenTransCount)
                                        .sort((a, b) => a.Material.localeCompare(b.Material)); 
                                    
                                    if (topContenders.length > 0) {
                                        winnerNonGenuineMaterial = topContenders[0].Material;
                                    }
                                }

                                distinctMaterials.forEach(item => {
                                    let recommendation = "NOK";
                                    
                                    if (item.GenuineStatus === "Genuine") {
                                        recommendation = "OK";
                                    } 
                                    else if (item.Material === winnerNonGenuineMaterial) {
                                        recommendation = "OK";
                                    }

                                    finalCandidates.push({
                                        ...item,
                                        CandidateReason: `MPN ${mpn} digunakan oleh ${distinctMaterials.length} Material berbeda`,
                                        DataRecommendation: recommendation 
                                    });
                                });
                            }
                        });

                        finalCandidates.sort((a, b) => {
                            if (a.MPN !== b.MPN) return a.MPN.localeCompare(b.MPN);
                            return a.Material.localeCompare(b.Material);
                        });

                        setResults(finalCandidates);
                        setStep(2);

                    } catch (err) {
                        console.error(err);
                        setError(err.message || "Terjadi kesalahan saat memproses file.");
                    } finally {
                        setIsProcessing(false);
                        setProgressMsg('');
                    }
                }, 500);
            };

            // --- FUNGSI DOWNLOAD EXCEL ---
            const handleDownload = () => {
                if (!results.length) return;

                const exportData = results.map(item => ({
                    "Material Code": item.Material,
                    "Material Description": item.Description,
                    "Genuine / Non": item.GenuineStatus,
                    "Manufacturer Part No (MPN)": item.MPN,
                    "Jml Transaksi": item.TransCount, 
                    "Equipment ID": item.EquipId,
                    "Brand (Merk)": item.Brand,
                    "Site": item.Site, 
                    "Lokasi Site": item.SiteLocation, 
                    "Status": "Kandidat FF Class",
                    "Keterangan": item.CandidateReason,
                    "Rekomendasi By Data": item.DataRecommendation 
                }));

                const ws = window.XLSX.utils.json_to_sheet(exportData, {
                    header: [
                        "Material Code", "Material Description", "Genuine / Non", "Manufacturer Part No (MPN)", 
                        "Jml Transaksi", "Equipment ID", "Brand (Merk)", "Site", "Lokasi Site", 
                        "Status", "Keterangan", "Rekomendasi By Data"
                    ]
                });

                const merges = [];
                let startRow = 1; 

                for (let i = 0; i < results.length; i++) {
                    if (i === results.length - 1 || results[i].MPN !== results[i + 1].MPN) {
                        const endRow = i + 1;
                        if (endRow > startRow) {
                            merges.push({ s: { r: startRow, c: 3 }, e: { r: endRow, c: 3 } }); // MPN
                            merges.push({ s: { r: startRow, c: 9 }, e: { r: endRow, c: 9 } }); // Status
                            merges.push({ s: { r: startRow, c: 10 }, e: { r: endRow, c: 10 } }); // Keterangan
                        }
                        startRow = endRow + 1;
                    }
                }

                ws['!merges'] = merges;
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "Kandidat FF Class");
                window.XLSX.writeFile(wb, "Hasil_Analisa_FF_Class.xlsx");
            };

            const reset = () => {
                setUsageFiles([]);
                setAssetFile(null);
                setResults([]);
                setStep(1);
                setError('');
            };

            const mpnCounts = results.reduce((acc, item) => {
                acc[item.MPN] = (acc[item.MPN] || 0) + 1;
                return acc;
            }, {});

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 p-4 md:p-8">
                    <div className="max-w-full mx-auto">
                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-6 border-l-4 border-navy-900 animate-fade-in">
                            <h1 className="text-2xl font-bold text-navy-900 flex items-center gap-3">
                                <IconLayers className="w-8 h-8 text-orange-500" />
                                Aplikasi Analisa FF Class
                            </h1>
                            <p className="text-slate-500 mt-2 text-sm">
                                Mendeteksi potensi Interchangeability Material. Menggunakan Data Brand untuk referensi.
                            </p>
                        </div>

                        {step === 1 && (
                            <div className="grid md:grid-cols-2 gap-6 animate-fade-in"> 
                                <div className={`relative group bg-white p-8 rounded-2xl shadow-md border-2 border-dashed transition-all duration-300 hover:shadow-xl ${usageFiles.length > 0 ? 'border-orange-400 bg-orange-50' : 'border-slate-300 hover:border-orange-400'}`}>
                                    <div className="flex flex-col items-center text-center">
                                        <div className={`p-4 rounded-full mb-4 shadow-sm ${usageFiles.length > 0 ? 'bg-orange-100' : 'bg-slate-100'}`}>
                                            {usageFiles.length > 0 ? <IconFileText className="w-10 h-10 text-orange-600" /> : <IconFileSpreadsheet className="w-10 h-10 text-slate-500" />}
                                        </div>
                                        <h3 className="font-bold text-lg mb-1 text-slate-800">1. Data Pemakaian (MB51)</h3>
                                        <p className="text-xs text-slate-500 mb-6">Upload file tahun 2019 s/d 2025</p>
                                        <input 
                                            type="file" 
                                            accept=".xlsx, .xls"
                                            multiple 
                                            onChange={(e) => setUsageFiles(Array.from(e.target.files))} 
                                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                        />
                                        <button className={`pointer-events-none px-5 py-2.5 rounded-lg font-medium text-sm transition-all shadow-sm ${usageFiles.length > 0 ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-orange-200' : 'bg-slate-100 text-slate-600'}`}>
                                            {usageFiles.length > 0 ? `${usageFiles.length} File Terpilih` : "Pilih File Excel (Bisa Banyak)"}
                                        </button>
                                        {usageFiles.length > 0 && (
                                            <p className="text-xs text-orange-700 mt-3 max-w-xs truncate font-medium">
                                                {usageFiles.map(f => f.name).join(', ')}
                                            </p>
                                        )}
                                    </div>
                                </div>

                                <div className={`relative group bg-white p-8 rounded-2xl shadow-md border-2 border-dashed transition-all duration-300 hover:shadow-xl ${assetFile ? 'border-orange-400 bg-orange-50' : 'border-slate-300 hover:border-orange-400'}`}>
                                    <div className="flex flex-col items-center text-center">
                                        <div className={`p-4 rounded-full mb-4 shadow-sm ${assetFile ? 'bg-orange-100' : 'bg-slate-100'}`}>
                                            <IconFilter className={`w-10 h-10 ${assetFile ? 'text-orange-600' : 'text-slate-500'}`} />
                                        </div>
                                        <h3 className="font-bold text-lg mb-1 text-slate-800">2. Brand By Equipment</h3>
                                        <p className="text-xs text-slate-500 mb-6">Excel (.xlsx/csv)</p>
                                        <input 
                                            type="file" 
                                            accept=".xlsx, .xls, .csv"
                                            onChange={(e) => setAssetFile(e.target.files[0])}
                                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                        />
                                        <button className={`pointer-events-none px-5 py-2.5 rounded-lg font-medium text-sm transition-all shadow-sm ${assetFile ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-orange-200' : 'bg-slate-100 text-slate-600'}`}>
                                            {assetFile ? assetFile.name : "Pilih File Brand"}
                                        </button>
                                    </div>
                                </div>

                                <div className="md:col-span-2 flex flex-col items-center justify-center mt-6">
                                    {error && (
                                        <div className="flex items-center gap-2 text-red-600 bg-red-50 px-4 py-3 rounded-lg mb-4 w-full max-w-xl border border-red-100 shadow-sm animate-fade-in">
                                            <IconAlertCircle className="w-5 h-5 flex-shrink-0" />
                                            <span className="text-sm font-medium">{error}</span>
                                        </div>
                                    )}
                                    
                                    <button
                                        onClick={handleProcess}
                                        disabled={isProcessing || usageFiles.length === 0 || !assetFile}
                                        className={`w-full max-w-md py-3.5 px-6 rounded-xl font-bold text-lg shadow-lg transition-all flex items-center justify-center gap-3 transform active:scale-95
                                            ${isProcessing || usageFiles.length === 0 || !assetFile
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' 
                                                : 'bg-navy-900 text-white hover:bg-navy-800 hover:shadow-xl hover:-translate-y-1'}`}
                                    >
                                        {isProcessing ? (
                                            <>
                                                <IconLoader2 className="w-5 h-5 animate-spin" />
                                                <span className="text-base font-normal">{progressMsg || "Sedang Memproses..."}</span>
                                            </>
                                        ) : (
                                            <>
                                                Mulai Analisa
                                                <IconArrowRight className="w-5 h-5" />
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex justify-between items-center bg-white p-5 rounded-2xl border border-slate-200 shadow-lg">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-800">Hasil Identifikasi Kandidat</h2>
                                        <p className="text-slate-500 text-sm mt-1">
                                            Ditemukan <span className="font-bold text-orange-600">{results.length}</span> baris data.
                                        </p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={reset} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 font-medium flex items-center gap-2 transition-colors">
                                            <IconRefreshCw className="w-4 h-4" /> Ulangi
                                        </button>
                                        <button onClick={handleDownload} className="px-5 py-2 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-lg hover:shadow-lg font-medium flex items-center gap-2 shadow-md transition-all hover:-translate-y-0.5">
                                            <IconDownload className="w-4 h-4" /> Download Excel
                                        </button>
                                    </div>
                                </div>

                                {results.length === 0 ? (
                                    <div className="bg-white p-16 rounded-2xl text-center border-2 border-dashed border-slate-300">
                                        <div className="bg-slate-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <IconCheckCircle className="w-8 h-8 text-emerald-500" />
                                        </div>
                                        <h3 className="text-xl font-bold text-slate-800">Tidak Ada Kandidat</h3>
                                        <p className="text-slate-500 mt-2">Semua MPN memiliki hubungan 1-ke-1 dengan Kode Material (atau Brand tidak terdaftar).</p>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left border-collapse">
                                                <thead className="bg-navy-900 text-white text-[10px] uppercase font-bold tracking-wider">
                                                    <tr>
                                                        <th className="p-3 border-r border-navy-800/50">Material Code</th>
                                                        <th className="p-3 border-r border-navy-800/50">Deskripsi Material</th>
                                                        <th className="p-3 border-r border-navy-800/50 text-center">Genuine / Non</th>
                                                        <th className="p-3 border-r border-navy-800/50 bg-orange-600 text-white text-center">Manufacturer Part No (MPN)</th>
                                                        <th className="p-3 border-r border-navy-800/50 text-center w-20">Jml Transaksi</th>
                                                        <th className="p-3 border-r border-navy-800/50">Equipment</th>
                                                        <th className="p-3 border-r border-navy-800/50">Brand (Merk)</th>
                                                        <th className="p-3 border-r border-navy-800/50 text-center">Site</th>
                                                        <th className="p-3 border-r border-navy-800/50 text-center">Lokasi Site</th>
                                                        <th className="p-3 bg-slate-800 text-white text-center w-32">Status</th>
                                                        <th className="p-3 bg-orange-500 text-white text-center w-32">Rekomendasi</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-200 text-xs">
                                                    {results.map((item, idx) => {
                                                        const isFirstInGroup = idx === 0 || item.MPN !== results[idx - 1].MPN;
                                                        const rowSpan = mpnCounts[item.MPN];
                                                        
                                                        return (
                                                            <tr key={idx} className={`hover:bg-orange-50/50 transition-colors ${isFirstInGroup && idx !== 0 ? 'border-t-4 border-slate-300' : 'border-t border-slate-100'}`}>
                                                                <td className="p-2 border-r border-slate-100 font-mono text-slate-600 font-semibold align-middle">{item.Material}</td>
                                                                <td className="p-2 border-r border-slate-100 text-slate-700 align-middle">{item.Description}</td>
                                                                
                                                                <td className={`p-2 border-r border-slate-100 text-center font-bold align-middle ${item.GenuineStatus === 'Genuine' ? 'text-navy-600' : 'text-orange-600'}`}>
                                                                    {item.GenuineStatus}
                                                                </td>

                                                                {isFirstInGroup && (
                                                                    <td rowSpan={rowSpan} className="p-2 border-r border-slate-300 font-bold text-orange-600 bg-white align-middle text-center border-b-4 shadow-sm">
                                                                        {item.MPN}
                                                                    </td>
                                                                )}
                                                                
                                                                <td className="p-2 border-r border-slate-100 text-center font-semibold text-slate-700 align-middle bg-slate-50/50">
                                                                    {item.TransCount}
                                                                </td>

                                                                <td className="p-2 border-r border-slate-100 font-mono text-[10px] text-slate-500 align-middle">{item.EquipId}</td>
                                                                <td className="p-2 border-r border-slate-100 font-bold text-slate-700 align-middle">{item.Brand}</td>
                                                                <td className="p-2 border-r border-slate-100 text-slate-600 align-middle text-center">{item.Site}</td>
                                                                <td className="p-2 border-r border-slate-100 text-slate-600 align-middle text-center font-medium bg-slate-50/30">{item.SiteLocation}</td>
                                                                
                                                                {isFirstInGroup && (
                                                                    <td rowSpan={rowSpan} className="p-2 align-middle text-center bg-white border-b-4 border-slate-300">
                                                                        <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-navy-100 text-navy-800 border border-navy-200">
                                                                            Kandidat FF Class
                                                                        </span>
                                                                    </td>
                                                                )}

                                                                <td className={`p-2 border-r border-slate-100 text-center font-bold align-middle ${item.DataRecommendation === 'OK' ? 'text-white bg-navy-500' : 'text-white bg-red-500'}`}>
                                                                    {item.DataRecommendation}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
